[package]
name = "flashdrive-fast"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultra high-speed & lightweight file transfer utility for Windows written in Rust"
repository = "https://github.com/barron-local/flashdrive-fast"

[dependencies]
eframe = "0.29"
rfd = "0.15"
sysinfo = "0.32"
crossbeam-channel = "0.5"
rayon = "1.10"
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO"
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
